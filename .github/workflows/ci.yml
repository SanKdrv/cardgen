name: ci

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Линтеры, типы и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Установить зависимости
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy src
      - name: Тесты с покрытием
        run: pytest --cov=cardgen --cov-report=term-missing --cov-report=json:coverage.json
      - name: Обновить данные бейджа покрытия
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/coverage_badge.py
      - name: Закоммитить бейдж покрытия
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.json
          if git diff --cached --quiet; then
            echo "coverage badge is up to date"
            exit 0
          fi
          git commit -m "chore: обновить бейдж покрытия" -m "Автоматическое обновление после зелёного прогона тестов."
          git push
      - name: Проверка конфигурации офлайн-режима
        env:
          CARDGEN_PROVIDER: fixture
        run: cardgen check-config

  docker:
    name: Сборка образа
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать Docker-образ
        run: docker build -t cardgen:ci .
