name: ci

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Линтеры, типы и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Установить зависимости
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy src
      - name: Тесты с покрытием
        run: pytest --cov=cardgen --cov-report=term-missing --cov-report=json:coverage.json
      - name: Обновить данные бейджа покрытия
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/coverage_badge.py
      - name: Закоммитить бейдж покрытия
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.json
          if git diff --cached --quiet; then
            echo "coverage badge is up to date"
            exit 0
          fi
          git commit -m "chore: обновить бейдж покрытия" -m "Автоматическое обновление после зелёного прогона тестов."
          git push
      - name: Проверка конфигурации офлайн-режима
        env:
          CARDGEN_PROVIDER: fixture
        run: cardgen check-config

  docker:
    name: Сборка и запуск образа
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать Docker-образ
        run: docker build -t cardgen:ci .
      - name: Запустить контейнер
        run: |
          docker run -d --name cardgen-ci -p 8000:8000 -e CARDGEN_PROVIDER=fixture cardgen:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/cards \
            -H "Content-Type: application/json" \
            --data-binary @examples/request-dm02.json \
            -o /tmp/card.json
          python -c "import json; d=json.load(open('/tmp/card.json')); assert d['meta']['validation']['ok']; assert not d['meta']['fallback_used']; print(d['draft']['seo_title'])"
          curl -fsS http://127.0.0.1:8000/api/v1/examples | python -c "import json,sys; assert len(json.load(sys.stdin)) >= 15"
      - name: Логи контейнера
        if: always()
        run: docker logs cardgen-ci || true
      - name: Остановить контейнер
        if: always()
        run: docker rm -f cardgen-ci || true

  windows:
    name: Windows smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Установить зависимости
        run: pip install -e ".[dev]"
      - name: Тесты на Windows
        run: pytest -q
